<html>

	<head>

		<title>code.tk.sg</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.ico" sizes="any"/>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
		<link rel="icon" href="/favicon-256.png" type="image/png" sizes="256x256"/>
		<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
		<link rel="stylesheet" type="text/css" href="solarized_dark.css"/>
		<link rel="stylesheet" type="text/css" href="application.css?v=toolbar-menu-2"/>

		<script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
		<script type="text/javascript" src="highlight.min.js?v=languages-2"></script>
		<script type="text/javascript" src="language-detect.js?v=languages-2"></script>
		<!-- qrcode-generator 1.4.4, MIT; generated locally, no external QR service. -->
		<script type="text/javascript" src="vendor/qrcode.js"></script>
		<script type="text/javascript" src="application.min.js?v=toolbar-menu-2"></script>

		<meta name="robots" content="noindex,nofollow"/>

		<script type="text/javascript">
			var app = null;
			// Handle pops
			var handlePop = function(evt) {
				var path = evt.target.location.pathname;
				if (path === '/') { app.newDocument(true); }
				else { app.loadDocument(path.substring(1, path.length)); }
			};
			// Set up the pop state to handle loads, skipping the first load
			// to make chrome behave like others:
			// http://code.google.com/p/chromium/issues/detail?id=63040
			setTimeout(function() {
				window.onpopstate = function(evt) {
					try { handlePop(evt); } catch(err) { /* not loaded yet */ }
				};
			}, 1000);
			// Construct app and load initial path
			$(function() {
				app = new haste('code.tk.sg');
				handlePop({ target: window });
			});
		</script>

	</head>

	<body>
		<ul id="messages"></ul>

		<div id="key">
			<div id="box1">
				<a href="https://tinkercademy.com" class="logo" aria-label="Visit Tinkercademy"><img src="/tinkercademy.png" alt="" />code.tk.sg</a>
			</div>
			<div id="box2" role="group" aria-label="Paste actions">
				<button class="save function primary" aria-label="Save"><span class="icon" aria-hidden="true"></span><span class="text" aria-hidden="true">Save</span></button>
				<button class="copy function primary" aria-label="Copy all"><span class="icon" aria-hidden="true"></span><span class="text" aria-hidden="true">Copy all</span></button>
				<button class="share function" aria-label="Share" aria-expanded="false" aria-controls="share-panel"><span class="icon" aria-hidden="true"></span></button>
				<button class="duplicate function" aria-label="Duplicate & edit"><span class="icon" aria-hidden="true"></span></button>
				<button class="new function" aria-label="New"><span class="icon" aria-hidden="true"></span></button>
				<button class="more function" aria-label="More options" aria-expanded="false" aria-controls="more-panel"><span class="icon" aria-hidden="true"></span></button>
			</div>
			<p id="key-status" class="sr-only" role="status"></p>
			<div id="box3" role="tooltip" style="display:none;">
				<div class="label"></div>
				<div class="shortcut"></div>
			</div>
			<section id="share-panel" aria-label="Share paste link" hidden>
				<label class="sr-only" for="share-url">Paste link</label>
				<div class="share-link">
					<input id="share-url" type="text" readonly />
					<button id="copy-link" aria-label="Copy link" title="Copy link"><span class="icon" aria-hidden="true"></span></button>
					<button id="show-qr" aria-label="Show QR code" title="Show QR code" aria-expanded="false" aria-controls="share-qr"><span class="icon" aria-hidden="true"></span></button>
				</div>
				<p id="share-status" role="status"></p>
				<div id="share-qr" hidden></div>
			</section>
			<section id="more-panel" aria-label="More options" hidden>
				<div class="menu-row">
					<span id="text-size-label">Text size</span>
					<div class="stepper" role="group" aria-labelledby="text-size-label">
						<button id="text-smaller" aria-label="Smaller text">A&minus;</button>
						<output id="text-size" aria-live="polite">100%</output>
						<button id="text-larger" aria-label="Larger text">A+</button>
					</div>
				</div>
				<label class="menu-row">
					<span>Wrap long lines</span>
					<input id="wrap-toggle" type="checkbox" role="switch" checked />
				</label>
				<div class="menu-links">
					<a id="download-link" class="saved-only" href="#" download><span class="icon" aria-hidden="true"></span>Download file</a>
					<a id="raw-link" class="saved-only" href="#"><span class="icon" aria-hidden="true"></span>View raw text</a>
					<a class="github" href="https://github.com/tinkertanker/code.tk.sg"><span class="icon" aria-hidden="true"></span>Source on GitHub</a>
				</div>
			</section>
		</div>

		<div id="linenos"></div>
		<pre id="box" style="display:none;" class="hljs" tabindex="0"><code></code></pre>
		<textarea aria-label="Paste text" spellcheck="false" style="display:none;"></textarea>

	</body>

</html>
