[package]
name = "code-tk"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
md5 = "0.8"
multer = "3"
percent-encoding = "2"
quick-js = "0.4"
rand = "0.9"
redis = { version = "0.29", features = ["tokio-comp", "connection-manager"] }
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
