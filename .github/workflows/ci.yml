name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main are never cancelled mid-deploy
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Temporary draft-PR experiment: compare full jobs on identical revisions.
    strategy:
      fail-fast: false
      matrix:
        dependencies: [baseline, cached]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install test dependencies
        if: matrix.dependencies == 'cached'
        uses: ./.github/actions/install-dependencies
      - name: Baseline clean installs (no cache action)
        if: matrix.dependencies == 'baseline'
        run: npm ci && npm --prefix worker ci
      - name: Frontend build and tests
        run: npm run build && npm test
      - name: HTTP contracts against local wrangler dev
        run: |
          cd worker
          npm run db:init
          npx wrangler d1 execute DB --local --command "INSERT INTO documents VALUES ('legacykey', 'old paste' || char(10) || 'é <&>' || char(10), NULL)"
          npm run dev:compat -- --port 8787 --var MAX_LENGTH:32 --var EXPIRE:60 --var RATE_MAX:10000 > ../wrangler.log 2>&1 &
          for attempt in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8787/ || { echo 'wrangler dev did not start'; cat ../wrangler.log; exit 1; }
          cd ..
          WORKER_URL=http://127.0.0.1:8787 python3 tests/compatibility.py || { cat wrangler.log; exit 1; }
      - name: Intentional downstream failure (first PR attempt only)
        if: github.event_name == 'pull_request' && github.run_attempt == 1 && matrix.dependencies == 'cached'
        run: |
          echo 'Measurement-only failure after cache save and all real tests; rerun proves persistence.'
          exit 23

  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dependencies: [baseline, cached]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install test dependencies
        if: matrix.dependencies == 'cached'
        uses: ./.github/actions/install-dependencies
      - name: Baseline clean installs (no cache action)
        if: matrix.dependencies == 'baseline'
        run: npm ci && npm --prefix worker ci
      - name: Build static assets
        run: npm run build
      - name: Worker typecheck, tests and bundle
        working-directory: worker
        run: npm run typecheck && npm test && npm run build
      - name: Intentional downstream failure (first PR attempt only)
        if: github.event_name == 'pull_request' && github.run_attempt == 1 && matrix.dependencies == 'cached'
        run: |
          echo 'Measurement-only failure after cache save and all real tests; rerun proves persistence.'
          exit 23

  # Temporary, unprivileged deployment-install comparison: never migrates or deploys.
  deployment-build-measurement:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dependencies: [baseline, cached]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install deployment dependencies (no lifecycle scripts)
        if: matrix.dependencies == 'cached'
        uses: ./.github/actions/install-dependencies
        with:
          install-mode: ignore-scripts
      - name: Baseline clean installs (no cache action or lifecycle scripts)
        if: matrix.dependencies == 'baseline'
        run: npm ci --ignore-scripts && npm --prefix worker ci --ignore-scripts
      - name: Frontend build and Worker dry-run only
        run: npm run build && npm --prefix worker run build
      - name: Intentional downstream failure (first PR attempt only)
        if: github.run_attempt == 1 && matrix.dependencies == 'cached'
        run: |
          echo 'Measurement-only failure after script-disabled cache save and dry-run; no deployment.'
          exit 23

  # Deploys main to production after both test jobs pass, then smoke-tests it.
  # Needs a CLOUDFLARE_API_TOKEN secret (repository or "production" environment).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://code.tk.sg
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: b8b1032c61d9475cd00229c74db7ec72
    # The token is passed only to the steps that need it, never to npm installs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Until the secret exists, skip deploying (with a warning) rather than failing main
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::warning::CLOUDFLARE_API_TOKEN is not set; skipping the production deploy'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install deployment dependencies (no lifecycle scripts)
        if: steps.creds.outputs.ready == 'true'
        uses: ./.github/actions/install-dependencies
        with:
          install-mode: ignore-scripts
      - name: Build (no dependency install scripts)
        if: steps.creds.outputs.ready == 'true'
        run: npm run build
      - name: Production migrations and deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy
      - name: Production smoke test
        if: steps.creds.outputs.ready == 'true'
        run: scripts/smoke-test.sh https://code.tk.sg
