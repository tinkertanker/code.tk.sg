name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Frontend build and tests
        run: npm ci && npm run build && npm test
      - name: HTTP contracts against local wrangler dev
        run: |
          npm --prefix worker ci
          cd worker
          npm run db:init
          npx wrangler d1 execute DB --local --command "INSERT INTO documents VALUES ('legacykey', 'old paste' || char(10) || 'é <&>' || char(10), NULL)"
          npm run dev:compat -- --port 8787 --var MAX_LENGTH:32 --var EXPIRE:60 --var RATE_MAX:10000 > ../wrangler.log 2>&1 &
          for attempt in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8787/ || { echo 'wrangler dev did not start'; cat ../wrangler.log; exit 1; }
          cd ..
          WORKER_URL=http://127.0.0.1:8787 python3 tests/compatibility.py || { cat wrangler.log; exit 1; }

  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build static assets
        run: npm ci && npm run build
      - name: Worker typecheck, tests and bundle
        working-directory: worker
        run: npm ci && npm run typecheck && npm test && npm run build

  # Deploys main to production after both test jobs pass, then smoke-tests it.
  # Needs the CLOUDFLARE_API_TOKEN secret on the "production" environment.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, worker]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://code.tk.sg
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b8b1032c61d9475cd00229c74db7ec72
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not set on the production environment'
            exit 1
          fi
      - name: Build
        run: npm ci && npm run build && npm --prefix worker ci
      - name: Production migrations and deploy
        working-directory: worker
        run: |
          npx wrangler d1 migrations apply DB --remote
          npx wrangler deploy
      - name: Production smoke test
        run: scripts/smoke-test.sh https://code.tk.sg
